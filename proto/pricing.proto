syntax = "proto3";

// What the Pricing Service takes 
message PriceRequest {
    float pickup_lat = 1;
    float pickup_long = 2;
    float destination_lat = 3;
    float destination_long = 4;
    double surge_multiplier = 5;
}

// Whats the Pricing Service repsonds with
message PriceResponse {
    double price = 1;
    double distance = 2;
}

service PricingService {
    rpc GetPrice (PriceRequest) returns (PriceResponse);
}